[package]
name = "spatialcoding"
version = "0.1.0"
edition = "2024"
description = "Spatial code visualization — a desktop CodeCanvas clone built with Rust and egui"

[dependencies]
eframe = "0.31"
egui = "0.31"
egui_extras = { version = "0.31", features = ["image"] }
syntect = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
petgraph = "0.7"
rfd = "0.15"
log = "0.4"
env_logger = "0.11"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
notify = "8.2.2"
similar = "3.2.1"

[dev-dependencies]
tempfile = "3"
regex = "1"
egui_kittest = { version = "0.31.1", features = ["eframe"] }

[profile.release]
opt-level = 2

[package]
name = "spatialcoding"
version = "0.1.0"
edition = "2024"
description = "Spatial code visualization — a desktop CodeCanvas clone built with Rust and egui"

[dependencies]
regex = "1"
eframe = "0.31"
egui = "0.31"
egui_extras = { version = "0.31", features = ["image"] }
syntect = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
petgraph = "0.7"
rfd = "0.15"
log = "0.4"
env_logger = "0.11"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
notify = "8.2.2"
similar = "3.2.1"
ureq = "3"
flate2 = "1.1.11"
tar = "0.4.46"
sha2 = "0.11.1"
base64 = "0.23.1"
rayon = "1"
mimalloc = "0.1.52"
profiling = "1.0.18"

[target.'cfg(unix)'.dependencies]
# geteuid: the socket directory must belong to the current user.
libc = "0.2"

[features]
# `cargo run --release --features profile` streams frame and function scopes
# to a running Tracy profiler (see the CLI guide). Off, the scopes cost nothing.
profile = ["profiling/profile-with-tracy"]

[dev-dependencies]
tempfile = "3"
egui_kittest = { version = "0.31.1", features = ["eframe"] }

[profile.release]
opt-level = 2
